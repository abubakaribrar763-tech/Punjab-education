const classGrid=document.getElementById('classGrid'),subjectGrid=document.getElementById('subjectGrid'),topicList=document.getElementById('topicList');
function renderClasses(){classGrid.innerHTML='';for(let i=1;i<=10;i++){let b=document.createElement('button');b.className='classbtn c'+i;b.textContent='Class '+i;b.onclick=()=>selectClass(i);classGrid.appendChild(b);}}

function selectSubject(sub){activeSubject=sub;document.getElementById('topicTitle').textContent=sub+' - Class '+activeClass;allTopics=syllabus[activeClass][sub]||[];renderTopics(allTopics);document.querySelectorAll('.subjectbtn').forEach(x=>x.classList.toggle('active',x.textContent===sub));}
function renderTopics(list){topicList.innerHTML='';list.forEach((t,i)=>{let div=document.createElement('div');div.className='topic';let btn=document.createElement('button');btn.className='topicbtn';btn.innerHTML='<span>'+(i+1)+'. '+t+'</span><span>▼</span>';let det=document.createElement('div');det.className='topicdetail';det.hidden=true;let yt='https://www.youtube.com/results?search_query='+encodeURIComponent(t+' '+activeSubject+' Class '+activeClass);det.innerHTML='<p style="margin:0 0 10px;color:#5a6f85;font-size:13px">'+t+'</p><div class="links"><a class="linkbtn yt" href="'+yt+'" target="_blank">▶️ YouTube</a><a class="linkbtn book" href="'+booksURL+'" target="_blank">📕 Book</a><a class="linkbtn test" href="#" onclick="alert(\'Test coming soon\');return false;">📝 Test</a></div>';btn.onclick=()=>{det.hidden=!det.hidden;};div.appendChild(btn);div.appendChild(det);topicList.appendChild(div);});}
document.getElementById('search').addEventListener('input',()=>{let q=document.getElementById('search').value.toLowerCase();renderTopics(allTopics.filter(t=>t.toLowerCase().includes(q)));});
